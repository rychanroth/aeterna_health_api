{% extends 'base.html' %}

{% block title %}{% if edit_mode %}Edit{% else %}Add{% endif %} Category - Aeterna Health{% endblock %}

{% block page_title %}{% if edit_mode %}Edit{% else %}Add{% endif %} Category{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{% url 'template_categories' %}" class="text-teal-600 hover:underline text-sm">&larr; Back to
        Categories</a>
</div>

<div class="bg-white rounded-lg shadow p-6 max-w-lg">
    <form method="POST" action="" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Category Name</label>
            <input type="text" name="name" required
                class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Image</label>
            <input type="file" name="image" accept="image/*"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
        </div>

        <button type="submit"
            class="bg-teal-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-teal-700 transition">
            {% if edit_mode %}Update{% else %}Create{% endif %} Category
        </button>
    </form>
</div>
{% endblock %}

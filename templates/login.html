<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Authentication | Aeterna Health</title>
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 relative overflow-hidden font-sans antialiased text-gray-800">

    <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-slate-900 to-slate-50 -z-10"></div>
    <div class="absolute top-20 left-1/2 -translate-x-1/2 w-[800px] h-[300px] bg-teal-500/20 blur-[120px] rounded-full -z-10 pointer-events-none"></div>

    <div class="w-full max-w-[420px] px-6 py-10 z-10">
        
        <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100">
            
            <div class="flex flex-col items-center mb-10">
                <div class="w-14 h-14 bg-teal-50 text-teal-600 rounded-2xl flex items-center justify-center mb-5 border border-teal-100 shadow-sm">
                    <i class='bx bx-plus-medical text-2xl'></i>
                </div>
                <h1 class="text-2xl font-black text-gray-900 tracking-tight">Aeterna Health</h1>
                <p class="text-xs text-gray-500 font-medium mt-1.5 tracking-wide uppercase">System Authentication</p>
            </div>
            
            {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for message in messages %}
                    <div class="flex items-start gap-3 p-3.5 bg-rose-50 border border-rose-100 rounded-xl text-rose-800 text-sm font-medium animate-pulse">
                        <i class='bx bxs-error-circle text-lg text-rose-500 mt-0.5 shrink-0'></i>
                        <p class="leading-relaxed">{{ message }}</p>
                    </div>
                    {% endfor %}
                </div>
            {% endif %}
            
            <form method="POST" action="{% url 'template-login' %}" class="space-y-5">
                {% csrf_token %}
                
                <div class="space-y-1.5">
                    <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider">Operator ID</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400 group-focus-within:text-teal-500 transition-colors">
                            <i class='bx bx-user text-lg'></i>
                        </div>
                        <input type="text" name="username" required autocomplete="username"
                            class="w-full pl-10 pr-4 py-3 bg-gray-50/50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10 transition-all text-gray-900 font-medium placeholder-gray-400"
                            placeholder="Enter your system username">
                    </div>
                </div>
                
                <div class="space-y-1.5" x-data="{ show: false }">
                    <div class="flex items-center justify-between">
                        <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider">Access Protocol</label>
                        <a href="#" tabindex="-1" class="text-[10px] font-bold text-teal-600 hover:text-teal-700 transition">Forgot Key?</a>
                    </div>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400 group-focus-within:text-teal-500 transition-colors">
                            <i class='bx bx-lock-alt text-lg'></i>
                        </div>
                        <input :type="show ? 'text' : 'password'" name="password" required autocomplete="current-password"
                            class="w-full pl-10 pr-12 py-3 bg-gray-50/50 border border-gray-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:border-teal-500 focus:ring-4 focus:ring-teal-500/10 transition-all text-gray-900 font-medium placeholder-gray-400"
                            placeholder="Enter your security phrase">
                        
                        <button type="button" @click="show = !show" 
                                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-teal-600 transition outline-none">
                            <i class='bx text-lg' :class="show ? 'bx-hide' : 'bx-show'"></i>
                        </button>
                    </div>
                </div>
                
                <div class="pt-2">
                    <button type="submit" 
                        class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-slate-900/10 active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
                        <span>Initialize Session</span>
                        <i class='bx bx-right-arrow-alt text-lg group-hover:translate-x-1 transition-transform'></i>
                    </button>
                </div>
            </form>

        </div>
        
        <div class="mt-8 text-center">
            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">&copy; 2024 Aeterna Health. Secured Node.</p>
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Aeterna Health{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-100 min-h-screen flex relative">
    
    <!-- SIDEBAR -->
    <aside class="w-64 bg-green-800 text-white sticky top-0 h-screen">
        <div class="p-4 text-xl font-bold border-b border-gray-700">
            Aeterna Health
        </div>
        <nav class="p-4 space-y-2">
            <a href="{% url 'home' %}" class="block py-2 px-3 rounded hover:bg-gray-700">Dashboard</a>
            
            <!-- We will add role-based links here in the future -->
        </nav>
    </aside>

    <!-- MAIN AREA -->
    <div class="flex-1 flex flex-col">
        
        <!-- TOP BAR -->
        <header class="bg-white shadow p-4 flex justify-between items-center">
            <h1 class="text-lg font-semibold">{% block page_title %}Page{% endblock %}</h1>
            <div class="flex items-center gap-4">
                <span class="text-gray-600 text-sm">{{ request.session.username }} ({{ request.session.role }})</span>
                <a href="{% url 'template_logout' %}" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">Logout</a>
            </div>
        </header>

        <!-- MESSAGES (Errors/Success) -->
        {% if messages %}
            <div class="p-4">
                {% for message in messages %}
                    <div class="bg-red-100 text-red-700 p-3 rounded mb-2">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <!-- CONTENT INJECTION POINT -->
        <main class="p-8">
            {% block content %}
            <!-- Child templates fill this space -->
            {% endblock %}
        </main>

    </div>

</body>
</html>
